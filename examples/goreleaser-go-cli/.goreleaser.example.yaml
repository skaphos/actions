version: 2

# Replace <<<REPLACE_...>>> placeholders with your project's values before use.
project_name: <<<REPLACE_PROJECT_NAME>>>

builds:
  - id: <<<REPLACE_BINARY_NAME>>>
    main: .
    binary: <<<REPLACE_BINARY_NAME>>>
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X <<<REPLACE_MODULE_PATH>>>/cmd/<<<REPLACE_BINARY_NAME>>>.Version={{.Version}}
      - -X <<<REPLACE_MODULE_PATH>>>/cmd/<<<REPLACE_BINARY_NAME>>>.Commit={{.Commit}}
      - -X <<<REPLACE_MODULE_PATH>>>/cmd/<<<REPLACE_BINARY_NAME>>>.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - third_party_licenses/**

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^chore\\("
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance Improvements
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  mode: replace
  draft: false
  make_latest: true

# Delete this entire block if you don't publish to Homebrew.
homebrew_casks:
  - repository:
      owner: <<<REPLACE_WITH_ORG>>>
      name: <<<REPLACE_WITH_TAP_REPO_NAME>>>
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/<<<REPLACE_WITH_ORG>>>/<<<REPLACE_WITH_REPO_NAME>>>"
    description: "<<<REPLACE_SHORT_DESCRIPTION>>>"
    license: "MIT"
    binaries:
      - <<<REPLACE_BINARY_NAME>>>
    # Strips the macOS Gatekeeper quarantine xattr so unsigned binaries don't
    # trip the "cannot be opened because the developer cannot be verified"
    # dialog on Apple Silicon. Guarded by on_macos so Linuxbrew is a no-op.
    # See skaphos/repokeeper ADR-0007 for the full rationale.
    custom_block: |
      postflight do
        on_macos do
          system_command "/usr/bin/xattr",
                         args: ["-dr", "com.apple.quarantine", "#{staged_path}/<<<REPLACE_BINARY_NAME>>>"]
        end
      end

snapshot:
  version_template: "{{ .Tag }}-next"
