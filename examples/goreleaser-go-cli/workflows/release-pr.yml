name: Release PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: Maintain Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Mint release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: skaphos/actions/release-pr@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Default inputs — uncomment to override:
          # manifest-path: .release-please-manifest.json
          # manifest-key: "."
          # bump: auto           # auto | major | minor | patch
          # tag-prefix: v
          # branch-prefix: release/v
          # pr-label: release-pr
