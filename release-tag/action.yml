name: "Skaphos Release Tag"
description: "On merge of a release PR, read the bumped version manifest and push the annotated vX.Y.Z tag. Pairs with skaphos/actions/release-pr."
author: "Skaphos"
branding:
  icon: tag
  color: green

inputs:
  token:
    description: "GitHub token with contents:write. Prefer a GitHub App installation token so downstream workflows listening on push:tags:'v*' will fire (GITHUB_TOKEN tag pushes do not trigger other workflows)."
    required: true
  manifest-path:
    description: "Path to the JSON manifest file committed by release-pr."
    required: false
    default: ".release-please-manifest.json"
  manifest-key:
    description: "JSON key inside the manifest."
    required: false
    default: "."
  tag-prefix:
    description: "Prefix prepended to the version."
    required: false
    default: "v"
  tagger-name:
    description: "Name for the annotated tag tagger."
    required: false
    default: "github-actions[bot]"
  tagger-email:
    description: "Email for the annotated tag tagger."
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"

outputs:
  tag:
    description: "The pushed tag (e.g. v1.2.3). Empty when pushed=false due to missing inputs."
    value: ${{ steps.tag.outputs.tag }}
  version:
    description: "The version without prefix (e.g. 1.2.3)."
    value: ${{ steps.tag.outputs.version }}
  pushed:
    description: "true if the tag was created by this run; false if it already existed at the expected SHA."
    value: ${{ steps.tag.outputs.pushed }}

runs:
  using: composite
  steps:
    - name: Create and push annotated tag
      id: tag
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        MANIFEST_KEY: ${{ inputs.manifest-key }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        TAGGER_NAME: ${{ inputs.tagger-name }}
        TAGGER_EMAIL: ${{ inputs.tagger-email }}
      run: |
        set -Eeuo pipefail

        REPO="${GITHUB_REPOSITORY}"

        # --- Require pull_request.merge_commit_sha from the event payload ---
        if [ ! -f "$GITHUB_EVENT_PATH" ]; then
          echo "::error::GITHUB_EVENT_PATH not set; this action must run on a pull_request event."
          exit 1
        fi

        MERGE_SHA=$(jq -r '.pull_request.merge_commit_sha // empty' "$GITHUB_EVENT_PATH")
        if [ -z "$MERGE_SHA" ]; then
          echo "::error::Could not read pull_request.merge_commit_sha from event. Ensure this runs on pull_request: closed with merged=true."
          exit 1
        fi
        echo "Merge commit: ${MERGE_SHA}"

        # --- Read manifest content at the merge commit via Contents API ---
        RAW=$(gh api "repos/${REPO}/contents/${MANIFEST_PATH}?ref=${MERGE_SHA}" --jq '.content' | tr -d '\n' | base64 -d)
        VERSION=$(echo "$RAW" | jq -r --arg key "$MANIFEST_KEY" '.[$key] // empty')
        if [ -z "$VERSION" ]; then
          echo "::error::Key '${MANIFEST_KEY}' not found in ${MANIFEST_PATH} at ${MERGE_SHA}."
          exit 1
        fi
        TAG="${TAG_PREFIX}${VERSION}"
        echo "Target tag: ${TAG}"

        # --- Short-circuit if tag already exists at the correct SHA ---
        EXISTING=$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null || true)
        if [ -n "$EXISTING" ]; then
          # Resolve tag object to its target commit if annotated
          EXISTING_TYPE=$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq '.object.type' 2>/dev/null || echo "commit")
          if [ "$EXISTING_TYPE" = "tag" ]; then
            TARGET_SHA=$(gh api "repos/${REPO}/git/tags/${EXISTING}" --jq '.object.sha')
          else
            TARGET_SHA="$EXISTING"
          fi
          if [ "$TARGET_SHA" = "$MERGE_SHA" ]; then
            echo "Tag ${TAG} already points at ${MERGE_SHA}; nothing to do."
            {
              echo "tag=${TAG}"
              echo "version=${VERSION}"
              echo "pushed=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Tag ${TAG} already exists but points at ${TARGET_SHA}, not the merge commit ${MERGE_SHA}. Manual intervention required."
          exit 1
        fi

        # --- Create an annotated tag object, then the ref ---
        TAG_OBJECT_SHA=$(gh api "repos/${REPO}/git/tags" \
          --method POST \
          -f "tag=${TAG}" \
          -f "message=Release ${TAG}" \
          -f "object=${MERGE_SHA}" \
          -f "type=commit" \
          -f "tagger[name]=${TAGGER_NAME}" \
          -f "tagger[email]=${TAGGER_EMAIL}" \
          -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --jq '.sha')

        gh api "repos/${REPO}/git/refs" \
          --method POST \
          -f "ref=refs/tags/${TAG}" \
          -f "sha=${TAG_OBJECT_SHA}" >/dev/null

        echo "Created and pushed tag ${TAG} -> ${MERGE_SHA}."
        {
          echo "tag=${TAG}"
          echo "version=${VERSION}"
          echo "pushed=true"
        } >> "$GITHUB_OUTPUT"
